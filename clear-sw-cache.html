<!DOCTYPE html>
<html>
<head>
    <title>Clear Service Worker Cache</title>
</head>
<body>
    <h1>Clearing Service Worker...</h1>
    <div id="status">Processing...</div>
    
    <script>
        async function clearServiceWorker() {
            const status = document.getElementById('status');
            
            try {
                // Unregister all service workers
                const registrations = await navigator.serviceWorker.getRegistrations();
                for (let registration of registrations) {
                    await registration.unregister();
                    console.log('Service Worker unregistered');
                }
                
                // Clear all caches
                const cacheNames = await caches.keys();
                await Promise.all(
                    cacheNames.map(cacheName => caches.delete(cacheName))
                );
                
                status.innerHTML = `
                    <h2 style="color: green;">✅ Success!</h2>
                    <p>Unregistered ${registrations.length} service worker(s)</p>
                    <p>Cleared ${cacheNames.length} cache(s)</p>
                    <p><strong>Now close this tab and refresh your app.</strong></p>
                `;
            } catch (error) {
                status.innerHTML = `
                    <h2 style="color: red;">❌ Error</h2>
                    <p>${error.message}</p>
                    <p>Try manually: DevTools → Application → Service Workers → Unregister</p>
                `;
            }
        }
        
        clearServiceWorker();
    </script>
</body>
</html>
